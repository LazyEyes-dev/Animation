<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dành riêng cho em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; background:#05020A; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  body{ position:fixed; inset:0; font-family:"Be Vietnam Pro", system-ui, sans-serif; color:#fff; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

  .title{ position:absolute; top:9vh; left:0; right:0; text-align:center; z-index:2; pointer-events:none; }
  .kicker{ font-size:.72rem; letter-spacing:.36em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:.6rem; }
  .name{ font-family:"Playfair Display", serif; font-style:italic; font-weight:600;
         font-size:clamp(2rem, 9vw, 3rem); text-shadow:0 0 30px rgba(255,180,220,.55); }

  .sign{ position:absolute; bottom:calc(3.2rem + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; z-index:2;
         font-family:"Playfair Display", serif; font-style:italic; font-size:clamp(1rem,4.4vw,1.3rem);
         color:rgba(255,215,235,.85); text-shadow:0 0 20px rgba(255,150,205,.5); opacity:0; transition:opacity 2s ease 1.2s; pointer-events:none; }
  .sign.on{ opacity:1; }
  .hint{ position:absolute; bottom:calc(1.4rem + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; z-index:2;
         font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.4); transition:opacity .8s ease; pointer-events:none; }
  .hint.gone{ opacity:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><div class="kicker" id="kicker"></div><div class="name" id="name"></div></div>
<div class="sign" id="sign"></div>
<div class="hint" id="hint">chạm vào trái tim</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CẤU HÌNH CƠ BẢN
   ═══════════════════════════════════════════════════════════ */
const KICKER    = "Dành riêng cho";
const RECIPIENT = "Thúy Thảo";
const SENDER    = "Trần Nguyễn Thức";
const PHRASES = [
  "Anh yêu em",
  "Cảm ơn em đã đến bên anh",
  "Gặp được em là may mắn lớn nhất của anh",
  "Bên em ngày nào cũng đáng nhớ",
  "Mình đi với nhau thật xa nhé"
];
const ROTATION_SPEED = 0.00035; // Tốc độ xoay (đã điều chỉnh cho mượt)
/* ═══════════════════════════════════════════════════════════ */

document.getElementById("kicker").textContent = KICKER;
document.getElementById("name").textContent   = RECIPIENT;
document.getElementById("sign").textContent   = "— " + SENDER;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

let W, H, dpr, U, cx, cy, scale, heartHalf, fontPx;
let chars = [], totalTextWidth = 0;

function heartXY(t){
  return { x: 16*Math.pow(Math.sin(t),3),
           y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) };
}

let parts = [], embers = [];
function buildParts(){
  parts = [];
  const nF = W<480 ? 340 : 520;
  for(let i=0;i<nF;i++){
    const t = Math.random()*Math.PI*2, p = heartXY(t);
    const edge = Math.random() < 0.30;
    const k = edge ? (1+Math.random()*0.12) : Math.sqrt(Math.random());
    parts.push({ hx:p.x*k, hy:p.y*k, x:Math.random()*W, y:Math.random()*H, vx:0, vy:0,
                 tw:Math.random()*6.28, tws:0.02+Math.random()*0.06, sz:(edge?0.7:0.9)+Math.random()*1.5, edge });
  }
  const nE = W<480 ? 26 : 40;
  embers = Array.from({length:nE}, () => ({ x:Math.random()*W, y:Math.random()*H, v:0.15+Math.random()*0.5,
                 drift:(Math.random()-0.5)*0.3, a:0.06+Math.random()*0.22, sz:0.6+Math.random()*1.6, tw:Math.random()*6.28 }));
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; 
  ctx.setTransform(dpr,0,0,dpr,0,0);
  
  U = Math.min(W,H); cx = W/2; cy = H*0.42; scale = U*0.021;
  heartHalf = 16*scale;                       
  fontPx = Math.max(14, U*0.04); 
  
  // Tính toán TỌA ĐỘ VẬT LÝ để dàn đều chữ (Khắc phục lỗi đè chữ)
  ctx.font = `600 ${fontPx}px "Be Vietnam Pro", sans-serif`;
  const ribbonStr = PHRASES.join("    ♥    ") + "    ♥    ";
  chars = [];
  totalTextWidth = 0;
  
  for (let i = 0; i < ribbonStr.length; i++) {
    const char = ribbonStr[i];
    const charWidth = ctx.measureText(char).width;
    chars.push({ char: char, w: charWidth, x: totalTextWidth });
    totalTextWidth += charWidth; // Cộng dồn chiều rộng để giãn cách chính xác
  }

  if(!parts.length) buildParts();
}
resize();
window.addEventListener("resize", resize);

function burst(){
  for(const p of parts){
    const dx=p.x-cx, dy=p.y-cy, d=Math.hypot(dx,dy)||1, f=7+Math.random()*11;
    p.vx += (dx/d)*f; p.vy += (dy/d)*f;
  }
  document.getElementById("hint").classList.add("gone");
}
window.addEventListener("pointerdown", burst);

let last = performance.now(), t0 = performance.now();
function draw(now){
  const dt = now-last; last = now; const t = now-t0;
  
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H); ctx.fillStyle="#05020A"; ctx.fillRect(0,0,W,H);

  const hue = (t*0.022)%360, pulse = 1+0.045*Math.sin(t*0.004), intro = Math.min(1,t/1200);

  const bloom = ctx.createRadialGradient(cx,cy,0,cx,cy,U*0.55);
  bloom.addColorStop(0,`hsla(${hue},85%,60%,${0.16*intro})`); bloom.addColorStop(1,"hsla(0,0%,0%,0)");
  ctx.fillStyle=bloom; ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation="lighter";
  for(const e of embers){
    e.y-=e.v; e.x+=e.drift; e.tw+=0.03; if(e.y<-6){e.y=H+6;e.x=Math.random()*W;}
    ctx.globalAlpha=e.a*(0.5+Math.sin(e.tw)*0.5)*intro; ctx.fillStyle=`hsl(${(hue+30)%360},90%,72%)`;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.sz,0,6.283); ctx.fill();
  }

  /* ---- TÍNH TOÁN QUỸ ĐẠO 3D ---- */
  const radiusX = heartHalf * 2.3; // Mở rộng vòng ngang
  const radiusZ = heartHalf * 1.5;
  const tilt = 0.12; // Độ nghiêng vòng
  
  let charList = [];
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i];
    // Map vị trí của ký tự lên đường tròn (chu vi = totalTextWidth)
    // Trừ đi thời gian (t) để chữ chạy theo chiều đúng
    const angle = ((c.x + c.w / 2) / totalTextWidth) * Math.PI * 2 - (t * ROTATION_SPEED);

    // Dùng Sin cho X và Cos cho Z để đảm bảo mặt trước chữ đọc từ Trái -> Phải
    const x0 = Math.sin(angle) * radiusX;
    const z0 = Math.cos(angle) * radiusZ;
    const y0 = 0;

    const x = cx + x0;
    const y = cy + (y0 * Math.cos(tilt) - z0 * Math.sin(tilt));
    const z = y0 * Math.sin(tilt) + z0 * Math.cos(tilt);

    const zScale = (z + radiusZ) / (radiusZ * 2); // Từ 0 (xa) đến 1 (gần)
    const pScale = 0.5 + zScale * 0.5; // Kích thước xa gần
    
    // Mặt sau (z < 0) tối hơn rất nhiều để không làm rối mắt
    const alpha = z >= 0 ? 0.3 + zScale * 0.7 : 0.05 + zScale * 0.2;

    charList.push({ char: c.char, x, y, z, pScale, alpha });
  }

  // Tách ra mặt trước và mặt sau
  const backChars = charList.filter(c => c.z < 0).sort((a, b) => a.z - b.z);
  const frontChars = charList.filter(c => c.z >= 0).sort((a, b) => a.z - b.z);

  ctx.globalCompositeOperation="source-over";
  ctx.textAlign="center"; 
  ctx.textBaseline="middle";
  ctx.font = `600 ${fontPx}px "Be Vietnam Pro", sans-serif`;

  /* ---- 1. VẼ VÒNG CHỮ PHÍA SAU ---- */
  for (const c of backChars) {
    ctx.setTransform(dpr * c.pScale, 0, 0, dpr * c.pScale, c.x * dpr, c.y * dpr);
    ctx.fillStyle = `rgba(255, 180, 220, ${c.alpha * intro})`; // Màu hồng nhạt, tối màu
    ctx.fillText(c.char, 0, 0);
  }

  // Reset transform để vẽ trái tim
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* ---- 2. VẼ TRÁI TIM ---- */
  ctx.globalCompositeOperation="lighter";
  const spring=0.045, damp=0.86;
  for(const p of parts){
    const hx=cx+p.hx*scale*pulse, hy=cy+p.hy*scale*pulse;
    p.vx=(p.vx+(hx-p.x)*spring)*damp; p.vy=(p.vy+(hy-p.y)*spring)*damp;
    p.x+=p.vx; p.y+=p.vy; p.tw+=p.tws;
    ctx.globalAlpha=(0.3+0.7*(0.5+0.5*Math.sin(p.tw)))*intro;
    ctx.fillStyle = p.edge ? `hsl(${(hue+20)%360},95%,80%)` : `hsl(${hue},90%,64%)`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,6.283); ctx.fill();
  }

  /* ---- 3. VẼ VÒNG CHỮ PHÍA TRƯỚC ---- */
  ctx.globalCompositeOperation="source-over";
  for (const c of frontChars) {
    ctx.setTransform(dpr * c.pScale, 0, 0, dpr * c.pScale, c.x * dpr, c.y * dpr);
    
    // Tối ưu FPS: Không dùng shadowBlur, vẽ chồng 2 lớp chữ lệch nhau tí xíu để tạo khối & sáng
    ctx.fillStyle = `rgba(255, 140, 200, ${c.alpha * 0.7 * intro})`; // Lớp bóng hồng
    ctx.fillText(c.char, 2, 2);
    
    ctx.fillStyle = `rgba(255, 255, 255, ${c.alpha * intro})`; // Lớp trắng lõi
    ctx.fillText(c.char, 0, 0);
  }

  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

setTimeout(()=>document.getElementById("sign").classList.add("on"),1300);
</script>
</body>

    ctx.setTransform(dpr * c.pScale, 0, 0, dpr * c.pScale, c.x * dpr, c.y * dpr);
    
    // Tối ưu FPS: Không dùng shadowBlur, vẽ chồng 2 lớp chữ lệch nhau tí xíu để tạo khối & sáng
    ctx.fillStyle = `rgba(255, 140, 200, ${c.alpha * 0.7 * intro})`; // Lớp bóng hồng
    ctx.fillText(c.char, 2, 2);
    
    ctx.fillStyle = `rgba(255, 255, 255, ${c.alpha * intro})`; // Lớp trắng lõi
    ctx.fillText(c.char, 0, 0);
  }

  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

setTimeout(()=>document.getElementById("sign").classList.add("on"),1300);
</script>
</body>
</html>
